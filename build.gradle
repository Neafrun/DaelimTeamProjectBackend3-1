plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.benefitmap.backend'
version = '0.0.1-SNAPSHOT'
description = 'benefit-map-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)  // 팀이 21 LTS라면 21로 바꿔도 OK
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // === 기본 ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly   'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // === 외부 오픈 API 호출용 WebClient ===
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // 서버는 MVC 유지, 클라이언트로만 사용

    // === API 문서 (Swagger UI) ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // === 캐시 (동일 파라미터 호출 결과 캐싱) ===
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // === 네트워크 안정화 (재시도/서킷브레이커) ===
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop' // @Retry 프록시용
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // === 테스트 ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
